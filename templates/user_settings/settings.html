{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OfficeSync - Settings</title>
    <link rel="stylesheet" href="{% static 'css/user_settings/settings.css' %}?v=1.2">
</head>
<body>
    <div class="card-container">
        <h2>Preferences & Settings</h2>
        <p>Configure app notifications and display behavior.</p>

        {% if message %}
            <p style="color: #16a34a; font-weight: 600;">{{ message }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="setting-row">
                <label>Enable Dark Mode</label>
                <input type="checkbox" name="dark_mode" {% if settings.dark_mode %}checked{% endif %}>
            </div>

            <div class="setting-row">
                <label>Email Notifications</label>
                <input type="checkbox" name="email_notif" {% if settings.email_notif %}checked{% endif %}>
            </div>

            <button type="submit" class="primary-btn">Save Changes</button>
        </form>

        <a href="{% url 'dashboard:home' %}" class="back-link">← Back to Dashboard</a>
    </div>
    <script src="{% static 'js/user_settings/settings.js' %}"></script>
</body>
</html>
