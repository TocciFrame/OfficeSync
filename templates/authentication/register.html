{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>OfficeSync - Register</title>
    <link rel="stylesheet" href="{% static 'css/authentication/register.css' %}?v=2.0">
</head>
<body>
    <div class="auth-card">
        <h1>OfficeSync</h1>
        <p>Create a new account</p>

        {% if error %}
            <p style="color: #dc2626; font-size: 0.9rem;">{{ error }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="text" name="first_name" placeholder="First Name" required><br>
            <input type="text" name="last_name" placeholder="Last Name" required><br>
            <input type="email" name="email" placeholder="Email Address" required><br>
            <input type="text" name="username" placeholder="Username" required><br>
            
            <select name="role" required>
                <option value="" disabled selected>Select Role</option>
                <option value="Admin">Administrator</option>
                <option value="Manager">Manager</option>
                <option value="Employee">Employee</option>
            </select><br>

            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Create Account</button>
        </form>

        <p style="margin-top: 1.25rem; font-size: 0.9rem; color: #64748b;">
            Already have an account? 
            <a href="{% url 'authentication:login' %}">Sign in!</a>
        </p>
    </div>
    <script src="{% static 'js/authentication/register.js' %}"></script>
</body>
</html>
