{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>OfficeSync - Login</title>
    <link rel="stylesheet" href="{% static 'css/authentication/login.css' %}?v=2.0">
</head>
<body>
    <div class="auth-card">
        <h1>OfficeSync</h1>
        <p>Sign in to your account</p>
        
        {% if error %}
            <p style="color: #dc2626; font-size: 0.9rem;">{{ error }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Sign In</button>
        </form>

        <!-- Redirect Link to Register Page -->
        <p>Don't have an account? <a href="{% url 'authentication:register' %}">Create one here</a></p>
    </div>
    <script src="{% static 'js/authentication/login.js' %}"></script>
</body>
</html>
