{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OfficeSync - Profile</title>
    <link rel="stylesheet" href="{% static 'css/user_profile/profile.css' %}?v=1.2">
</head>
<body>
    <div class="card-container">
        <h2>User Profile</h2>
        <p>Manage your account personal information.</p>

        {% if message %}
            <p style="color: #16a34a; font-weight: 600;">{{ message }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label>First Name</label>
            <input type="text" name="first_name" value="{{ request.user.first_name }}">

            <label>Last Name</label>
            <input type="text" name="last_name" value="{{ request.user.last_name }}">

            <label>Email</label>
            <input type="email" name="email" value="{{ request.user.email }}">

            <label>Role</label>
            <input type="text" name="role" value="{{ profile.role }}">

            <label>Bio</label>
            <textarea name="bio" rows="3">{{ profile.bio }}</textarea>

            <button type="submit" class="primary-btn">Save Profile</button>
        </form>

        <a href="{% url 'dashboard:home' %}" class="back-link">← Back to Dashboard</a>
    </div>
    <script src="{% static 'js/user_profile/profile.js' %}"></script>
</body>
</html>
